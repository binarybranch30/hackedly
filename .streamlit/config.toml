# Look: warm off-white canvas, deep navy text, teal accent; Bricolage Grotesque headings,
# Plus Jakarta Sans body. The sidebar "Dark mode" switch picks the dark palette.
[theme]
font = "Plus Jakarta Sans:https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Bricolage Grotesque:https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap, sans-serif"
headingFontWeights = [800, 700, 700, 600, 600, 600]
baseRadius = "0.7rem"
primaryColor = "#0E7C66"

[theme.light]
primaryColor = "#0E7C66"
backgroundColor = "#F6F7F4"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F1B2D"
borderColor = "#E4E6E0"

[theme.dark]
primaryColor = "#2BB394"
backgroundColor = "#0B1422"
secondaryBackgroundColor = "#13213A"
textColor = "#EEF2F6"
borderColor = "#22314B"

[client]
toolbarMode = "viewer"      # hide the developer "Deploy" menu

[server]
maxUploadSize = 25          # MB per file
